<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0A0E0C">
<title>Forge</title>
<link rel="stylesheet" href="styles/system.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0A0E0C;
    color: #FAF8F3;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    overflow: hidden;
  }
  .gate {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 24px;
  }
  .gate canvas {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: 0.35;
  }
  .gate-inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .glyph {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2D5E3E, #0A0E0C 75%);
    box-shadow: 0 0 24px rgba(45, 94, 62, 0.6), 0 0 80px rgba(45, 94, 62, 0.25);
    animation: pulse 3.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 24px rgba(45, 94, 62, 0.6), 0 0 80px rgba(45, 94, 62, 0.25); }
    50% { transform: scale(1.05); box-shadow: 0 0 32px rgba(45, 94, 62, 0.85), 0 0 120px rgba(45, 94, 62, 0.4); }
  }
  .label {
    font-size: 12px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(250, 248, 243, 0.5);
  }
  input[type="password"] {
    width: 220px;
    padding: 14px 18px;
    background: rgba(250, 248, 243, 0.04);
    border: 1px solid rgba(250, 248, 243, 0.12);
    border-radius: 10px;
    color: #FAF8F3;
    font-size: 18px;
    text-align: center;
    letter-spacing: 0.4em;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  input[type="password"]:focus {
    border-color: #2D5E3E;
    background: rgba(45, 94, 62, 0.08);
  }
  .shake {
    animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
  }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(3px); }
    30%, 50%, 70% { transform: translateX(-5px); }
    40%, 60% { transform: translateX(5px); }
  }
  .footer {
    position: fixed;
    bottom: 24px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(250, 248, 243, 0.25);
  }
</style>
</head>
<body>
<div class="gate">
  <canvas id="bg"></canvas>
  <div class="gate-inner">
    <div class="glyph"></div>
    <div class="label">Forge</div>
    <input type="password" id="pw" autocomplete="off" autofocus inputmode="numeric" pattern="[0-9]*">
  </div>
</div>
<div class="footer">Josh Harcus</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script>
  // SHA256 of "1835"
  const TARGET = "b18a5e6b50af3073f63ac2c4ee837a7c9c6f06d7e91206980283509e3738311e";

  // If already unlocked, redirect
  if (localStorage.getItem("forge-unlocked") === "1") {
    location.replace("app.html" + location.hash);
  }

  const input = document.getElementById("pw");
  input.addEventListener("input", () => {
    const v = input.value;
    if (v.length === 0) return;
    const hash = CryptoJS.SHA256(v).toString();
    if (hash === TARGET) {
      localStorage.setItem("forge-unlocked", "1");
      input.style.borderColor = "#2D5E3E";
      input.style.background = "rgba(45,94,62,0.18)";
      setTimeout(() => location.replace("app.html"), 280);
    } else if (v.length >= 4) {
      input.classList.remove("shake");
      void input.offsetWidth;
      input.classList.add("shake");
      input.value = "";
    }
  });

  // Constellation background
  const c = document.getElementById("bg");
  const ctx = c.getContext("2d");
  let stars = [];
  function resize() {
    c.width = innerWidth * devicePixelRatio;
    c.height = innerHeight * devicePixelRatio;
    c.style.width = innerWidth + "px";
    c.style.height = innerHeight + "px";
    ctx.scale(devicePixelRatio, devicePixelRatio);
    stars = Array.from({length: 60}, () => ({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      r: Math.random() * 1.2 + 0.3,
      a: Math.random() * 0.6 + 0.2,
      vx: (Math.random() - 0.5) * 0.05,
      vy: (Math.random() - 0.5) * 0.05
    }));
  }
  resize();
  addEventListener("resize", resize);
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const s of stars) {
      s.x += s.vx;
      s.y += s.vy;
      if (s.x < 0 || s.x > innerWidth) s.vx *= -1;
      if (s.y < 0 || s.y > innerHeight) s.vy *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(45,94,62,${s.a})`;
      ctx.fill();
    }
    // soft connecting lines
    for (let i = 0; i < stars.length; i++) {
      for (let j = i + 1; j < stars.length; j++) {
        const dx = stars[i].x - stars[j].x;
        const dy = stars[i].y - stars[j].y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d < 120) {
          ctx.beginPath();
          ctx.moveTo(stars[i].x, stars[i].y);
          ctx.lineTo(stars[j].x, stars[j].y);
          ctx.strokeStyle = `rgba(45,94,62,${0.08 * (1 - d/120)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
